# Runs self-hosted Renovate over the osdlc repositories, with config.js and
# the rules in default.json. It runs on GitHub Actions runners: nothing is sent
# to a hosted Renovate service.
#
# It acts as the osdlc Renovate GitHub App: the app's client id is the
# RENOVATE_APP_CLIENT_ID variable and its private key the
# RENOVATE_APP_PRIVATE_KEY secret. Renovate processes the repositories the app
# is installed on. Commits go through the GitHub API, so they are signed by
# GitHub and authored by the app.
#
# A run every four hours rebases and merges what is due. New pull requests
# open on the schedule in default.json; security fixes and osdlc packages open
# at any time. A manual run is a dry run unless `dry-run` is unchecked.
#
# Another account runs the same job from a repository of its own, by calling
# this workflow with its `owner`, its `config-file` and the app's client id
# and key. The job then runs on that repository's runners, and its log stays
# there.
#
# Every action is pinned to a commit SHA; the comment names its release.
name: renovate

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (open, update and merge nothing)
        type: boolean
        default: true
      log-level:
        description: Log level
        type: choice
        options: [info, debug]
        default: info
  workflow_call:
    inputs:
      owner:
        description: The account whose repositories Renovate processes
        type: string
        required: true
      config-file:
        description: The runner config, a path in the calling repository
        type: string
        required: true
      client-id:
        description: The Renovate app's client id
        type: string
        required: true
      dry-run:
        type: boolean
        default: false
      log-level:
        type: string
        default: info
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: renovate-${{ inputs.owner || github.repository_owner }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The calling repository, which holds the runner config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id || vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner || github.repository_owner }}

      # The app's bot user, so commits name it rather than Renovate's default
      # address, which belongs to Mend.
      - name: Find the app's bot user
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: ${{ inputs.config-file || 'config.js' }}
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.234.1
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
          # Empty on a scheduled run, which Renovate reads as unset.
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
